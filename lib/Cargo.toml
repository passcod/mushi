[package]
name = "mushi"
version = "0.0.12"
edition = "2024"

authors = ["Félix Saparelli <felix@passcod.name>"]
description = "WebTransport server for browsers, authenticated by certificate hash instead of web PKI"
documentation = "https://docs.rs/mushi"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/passcod/mushi"

[dependencies]
base64 = "0.22.1"
bytes = "1.10.1"
http = "1.3.1"
rcgen = "0.14.8"
thiserror = "2.0.12"
time = "0.3.41"
tracing = "0.1.41"
tokio = { version = "1.44.1", features = ["sync"] }
url = "2.5.4"
web-transport-proto = "0.6.0"
web-transport-quinn = { version = "0.12.0", default-features = false, features = ["ring"] }

[dev-dependencies]
tokio = { version = "1.44.1", features = ["full"] }
tracing-subscriber = "0.3.19"

[lints.rust]
missing_debug_implementations = "deny"
