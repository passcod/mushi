[workspace]
resolver = "3"
members = [
    "lib",
    "nodejs",
]

# The Python bindings still target the pre-pivot mutual-auth API and don't build. They're parked
# rather than deleted: reviving them is a matter of mirroring nodejs/src/lib.rs, and nothing else
# depends on them in the meantime. See python/README.md.
exclude = [
    "python",
]

[workspace.dependencies]

[profile.release]
lto = false
codegen-units = 16
strip = "symbols"

[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev.build-override]
opt-level = 0
codegen-units = 1024
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

[profile.release.build-override]
opt-level = 0
codegen-units = 1024
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
